name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Wait for GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            assets="$(gh release view "$TAG_NAME" --repo "$REPO_NAME" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "$assets" | grep -qx 'SHA256SUMS' &&
               printf '%s\n' "$assets" | grep -qx 'promemo-aarch64-apple-darwin.tar.gz' &&
               printf '%s\n' "$assets" | grep -qx 'promemo-x86_64-unknown-linux-gnu.tar.gz' &&
               printf '%s\n' "$assets" | grep -qx 'promemo-x86_64-pc-windows-msvc.zip'; then
              exit 0
            fi

            echo "Release assets for $TAG_NAME are not ready yet; retrying in 20 seconds..."
            sleep 20
          done

          echo "Timed out waiting for release assets for $TAG_NAME."
          exit 1

      - name: Prepare bundled binaries
        working-directory: npm/promemo
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run prepare-binaries

      - name: Publish to npm
        working-directory: npm/promemo
        run: npm publish
