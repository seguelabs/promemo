[package]
name = "promemo"
version = "0.3.8"
edition = "2021"
description = "Git-native project memory for AI-assisted development"
license = "MIT"
repository = "https://github.com/bhagath-krishna/promemo"
readme = "README.md"
keywords = ["cli", "git", "memory", "ai", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
