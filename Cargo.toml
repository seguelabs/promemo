[package]
name = "promem"
version = "0.1.0"
edition = "2021"
description = "Git-native project memory for AI-assisted development"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
